# Autonomous Marketing Agent Configuration - Multi-Platform Optimized

general:
  headless: false
  session_dir: "sessions"
  log_level: "INFO"
  
behavior:
  min_delay_seconds: 5
  max_delay_seconds: 15
  typing_speed_min_ms: 40
  typing_speed_max_ms: 90
  scroll_pause_min_sec: 2
  scroll_pause_max_sec: 4

loop_schedule:
  min_interval_hours: 2.1
  max_interval_hours: 4.8

limits:
  daily_max_x_posts: 2
  daily_max_x_likes: 3
  daily_max_x_follows: 2
  daily_max_ph_upvotes: 3
  daily_max_ph_comments: 1
  daily_max_ph_follows: 3
  daily_max_reddit_comments: 3
  daily_max_fb_posts: 2

facebook_pages:
  - name: "AI Marketing Expert"
    url: "https://www.facebook.com/profile.php?id=61589222139426"
    niche: "ai_marketing"
    language: "english"
    comment_links:
      - "https://wordpress.org/plugins/ai-marketing-expert/"
      - "https://wpthemespace.com/ai-marketing-expert/"
      - "https://wpthemespace.com/product/ai-marketing-expert/"
    targeting:
      page_queries:
        - "WordPress Marketing"
        - "WordPress Web Agency"
        - "WordPress SEO"
        - "WooCommerce Growth"
