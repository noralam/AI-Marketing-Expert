<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SocialPulse AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 390px; background: #0b0f19; color: #f8fafc; padding: 18px; font-size: 13px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
    .logo { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; color: #38bdf8; }
    .status { font-size: 11px; color: #10b981; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .dot { width: 6px; height: 6px; background: #10b981; border-radius: 50%; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; }
    input, select, textarea { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #fff; padding: 8px 10px; font-size: 12px; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
    
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tab { flex: 1; padding: 7px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #94a3b8; font-size: 11px; font-weight: 600; text-align: center; cursor: pointer; transition: all 0.2s; }
    .tab.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

    .btn { width: 100%; background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border: none; padding: 11px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 13px; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.95; }

    .result-box { margin-top: 14px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; display: none; }
    .result-text { white-space: pre-wrap; font-size: 12px; line-height: 1.5; color: #e2e8f0; max-height: 140px; overflow-y: auto; margin-bottom: 10px; }
    .image-preview { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; border: 1px solid #334155; }

    .btn-insert { background: #10b981; }
    .btn-insert:hover { opacity: 0.9; }

    .footer { margin-top: 14px; text-align: center; font-size: 11px; color: #64748b; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <span>⚡ SocialPulse AI</span>
    </div>
    <div class="status">
      <span class="dot"></span> Ready
    </div>
  </div>

  <div class="form-group">
    <label>Target Social Network</label>
    <div class="tabs">
      <div class="tab active" data-platform="x">X (Twitter)</div>
      <div class="tab" data-platform="linkedin">LinkedIn</div>
      <div class="tab" data-platform="facebook">Facebook</div>
    </div>
  </div>

  <div class="form-group">
    <label>Your Industry / Business Category</label>
    <select id="industrySelect">
      <option value="ecommerce_bags">👜 E-Commerce: Bags, Shoes & Fashion</option>
      <option value="cosmetics">💄 Beauty, Cosmetics & Skincare</option>
      <option value="hardware">🔧 Hardware, Electronics & Gadgets</option>
      <option value="software">💻 Tech, Software & Agencies</option>
      <option value="creator">✍️ Authors, Creators & Influencers</option>
      <option value="food">🍔 Food, Cafe & Lifestyle</option>
      <option value="general">💡 General Business / Service</option>
    </select>
  </div>

  <div class="form-group">
    <label>Product Name or Post Idea</label>
    <textarea id="topicInput" rows="2" placeholder="e.g. Waterproof leather travel backpack with laptop compartment..."></textarea>
  </div>

  <div class="form-group">
    <label>Post Tone</label>
    <select id="toneSelect">
      <option value="compelling">High-Converting & Engaging</option>
      <option value="educational">Informative & Helpful Tips</option>
      <option value="story">Behind-the-Scenes & Story</option>
      <option value="minimal">Minimal & Bold Statement</option>
    </select>
  </div>

  <button id="generateBtn" class="btn">
    <span>✨ Generate Post & AI Visual</span>
  </button>

  <div id="resultBox" class="result-box">
    <img id="imagePreview" class="image-preview" src="" alt="AI Visual Preview">
    <div id="resultText" class="result-text"></div>
    <button id="insertBtn" class="btn btn-insert">
      <span>🚀 1-Click Send to Compose Box</span>
    </button>
  </div>

  <div class="footer">
    SocialPulse AI Assistant • Version 1.0.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
